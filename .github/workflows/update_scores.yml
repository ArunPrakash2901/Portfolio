name: Incremental LLM Assessor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate-repositories:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai groq
          
      - name: Run LLM Scorer Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/llm_scorer.py
        
      - name: Commit State & Generated Scores
        run: |
          git config --global user.name "LLM Pipeline Bot"
          git config --global user.email "bot@portfolio.com"
          git add scripts/repo_state.json public/scores.json
          git diff-index --quiet HEAD || (
            git commit -m "chore: execute CDC load and sync LLM aggregated scores" &&
            git fetch origin master &&
            git rebase origin/master &&
            git push origin master
          )
# kickstart workflow
